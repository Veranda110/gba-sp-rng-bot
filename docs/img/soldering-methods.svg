<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Segoe UI, Arial, sans-serif">
<rect width="920" height="400" fill="#ffffff"/>
<text x="20" y="30" font-size="19" font-weight="600" fill="#111">Three ways to connect a wire to an ESP32 pin</text>
<text x="20" y="52" font-size="12.5" fill="#444">Side view through the protoboard, copper pads on the underside.</text>
<rect x="30" y="210" width="240" height="22" fill="#2f7d4a"/>
<rect x="97" y="232" width="36" height="5" fill="#c8742a"/>
<rect x="110" y="210" width="10" height="27" fill="#ffffff"/>
<rect x="157" y="232" width="36" height="5" fill="#c8742a"/>
<rect x="170" y="210" width="10" height="27" fill="#ffffff"/>
<rect x="70" y="150" width="90" height="34" rx="3" fill="#1d2d44"/>
<text x="115" y="172" font-size="11" fill="#9fb3cc" font-weight="400" text-anchor="middle">ESP32</text>
<rect x="106" y="196" width="18" height="14" fill="#222"/>
<rect x="112.5" y="184" width="5" height="62" fill="#9ea3a8"/>
<path d="M275,140 C240,150 175,160 175,204" fill="none" stroke="#1f6feb" stroke-width="6" stroke-linecap="round"/>
<path d="M175,204 L175,243 L125,243" fill="none" stroke="#d4883a" stroke-width="3"/>
<path d="M97,237 L141,237 Q137,248 119.0,250 Q101,248 97,237 Z" fill="#b8bcc2"/>
<text x="20" y="86" font-size="13.5" fill="#111" font-weight="600" text-anchor="start">1. Through the next hole</text>
<text x="20" y="103" font-size="12.5" fill="#333" font-weight="400" text-anchor="start">bare end bent onto the pin's pad,</text>
<text x="20" y="120" font-size="12.5" fill="#333" font-weight="400" text-anchor="start">then one joint over both</text>
<rect x="20" y="318" width="270" height="44" rx="6" fill="#2da44e" opacity="0.13"/>
<text x="30" y="336" font-size="12.5" fill="#222" font-weight="400" text-anchor="start">Easy: the wire lies flat on the pad</text>
<text x="30" y="353" font-size="12.5" fill="#222" font-weight="400" text-anchor="start">and cannot roll off</text>
<rect x="330" y="210" width="240" height="22" fill="#2f7d4a"/>
<rect x="397" y="232" width="36" height="5" fill="#c8742a"/>
<rect x="410" y="210" width="10" height="27" fill="#ffffff"/>
<rect x="457" y="232" width="36" height="5" fill="#c8742a"/>
<rect x="470" y="210" width="10" height="27" fill="#ffffff"/>
<rect x="370" y="150" width="90" height="34" rx="3" fill="#1d2d44"/>
<text x="415" y="172" font-size="11" fill="#9fb3cc" font-weight="400" text-anchor="middle">ESP32</text>
<rect x="406" y="196" width="18" height="14" fill="#222"/>
<rect x="412.5" y="184" width="5" height="62" fill="#9ea3a8"/>
<rect x="472.5" y="150" width="5" height="96" fill="#d4af37"/>
<rect x="466" y="196" width="18" height="14" fill="#222"/>
<rect x="466" y="140" width="18" height="38" rx="2" fill="#222"/>
<path d="M475,140 C475,132 505,134 578,134" fill="none" stroke="#cf222e" stroke-width="6" stroke-linecap="round"/>
<text x="491" y="158" font-size="11" fill="#555" font-weight="400" text-anchor="start">Dupont</text>
<text x="491" y="171" font-size="11" fill="#555" font-weight="400" text-anchor="start">jumper</text>
<text x="491" y="205" font-size="11" fill="#555" font-weight="400" text-anchor="start">header</text>
<path d="M397,237 L493,237 Q489,248 445.0,250 Q401,248 397,237 Z" fill="#b8bcc2"/>
<text x="320" y="86" font-size="13.5" fill="#111" font-weight="600" text-anchor="start">2. Header pin next to it</text>
<text x="320" y="103" font-size="12.5" fill="#333" font-weight="400" text-anchor="start">one solder blob joins both pads,</text>
<text x="320" y="120" font-size="12.5" fill="#333" font-weight="400" text-anchor="start">a Dupont jumper plugs on top</text>
<rect x="320" y="318" width="270" height="44" rx="6" fill="#2da44e" opacity="0.13"/>
<text x="330" y="336" font-size="12.5" fill="#222" font-weight="400" text-anchor="start">Easy and detachable: unplug the</text>
<text x="330" y="353" font-size="12.5" fill="#222" font-weight="400" text-anchor="start">jumper, no desoldering</text>
<rect x="630" y="210" width="240" height="22" fill="#2f7d4a"/>
<rect x="717" y="232" width="36" height="5" fill="#c8742a"/>
<rect x="730" y="210" width="10" height="27" fill="#ffffff"/>
<rect x="690" y="150" width="90" height="34" rx="3" fill="#1d2d44"/>
<text x="735" y="172" font-size="11" fill="#9fb3cc" font-weight="400" text-anchor="middle">ESP32</text>
<rect x="726" y="196" width="18" height="14" fill="#222"/>
<rect x="732.5" y="184" width="5" height="78" fill="#9ea3a8"/>
<path d="M880,282 L751,282" fill="none" stroke="#1f6feb" stroke-width="6" stroke-linecap="round"/>
<path d="M751,282 L741,270" fill="none" stroke="#d4883a" stroke-width="3"/>
<ellipse cx="735" cy="252" rx="7" ry="2.6" fill="none" stroke="#d4883a" stroke-width="2.5"/>
<ellipse cx="735" cy="258" rx="7" ry="2.6" fill="none" stroke="#d4883a" stroke-width="2.5"/>
<ellipse cx="735" cy="264" rx="7" ry="2.6" fill="none" stroke="#d4883a" stroke-width="2.5"/>
<path d="M717,237 L753,237 Q749,248 735.0,250 Q721,248 717,237 Z" fill="#b8bcc2"/>
<rect x="729" y="248" width="12" height="20" rx="4" fill="#b8bcc2" opacity="0.75"/>
<text x="620" y="86" font-size="13.5" fill="#111" font-weight="600" text-anchor="start">3. Straight onto the pin</text>
<text x="620" y="103" font-size="12.5" fill="#333" font-weight="400" text-anchor="start">bare end wrapped around the pin</text>
<text x="620" y="120" font-size="12.5" fill="#333" font-weight="400" text-anchor="start">that sticks out underneath</text>
<rect x="620" y="318" width="270" height="44" rx="6" fill="#d4a72c" opacity="0.13"/>
<text x="630" y="336" font-size="12.5" fill="#222" font-weight="400" text-anchor="start">Works, but fiddly: tin both first,</text>
<text x="630" y="353" font-size="12.5" fill="#222" font-weight="400" text-anchor="start">wrap once, use flux and a clamp</text>
</svg>